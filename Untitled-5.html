<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Petal Playlist</title>
	<style>
		:root{--ink:#563d49;--muted:#927784;--pink:#c85f83;--line:#f1dce3}
		*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Avenir Next",system-ui,sans-serif;background:radial-gradient(ellipse at 10% 10%,#fff,transparent 32%),linear-gradient(145deg,#fff8f6,#fff0f5 65%,#fff9f0)}
		.wrap{width:min(1020px,calc(100% - 32px));margin:auto;padding:30px 0 55px}header{text-align:center;padding:22px 10px 30px}.eyebrow{color:var(--pink);font-size:.74rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}h1{margin:9px 0;font:500 clamp(2.6rem,7vw,4.5rem) Georgia,serif;letter-spacing:-.05em}h1 span{color:var(--pink)}header p{max-width:470px;margin:auto;color:var(--muted);line-height:1.7}
		.layout{display:grid;grid-template-columns:minmax(245px,310px) 1fr;gap:22px;align-items:start}.panel,.card{background:#fffdfbe8;border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 38px #8b4e671a}.panel{padding:22px;position:sticky;top:16px}h2{margin:0 0 16px;font-size:1.15rem}label{display:block;margin:13px 0 6px;color:#765b68;font-size:.82rem;font-weight:700}input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font:inherit;font-size:.9rem;outline:none}input:focus{border-color:#e98eaa;box-shadow:0 0 0 3px #e98eaa29}input[type=file]{padding:9px;font-size:.78rem}.hint{display:block;margin-top:6px;color:#a28b96;font-size:.72rem}.add,.play{border:0;border-radius:999px;background:var(--pink);color:white;font:inherit;font-weight:750;cursor:pointer}.add{width:100%;padding:12px;margin-top:18px}.add:hover,.play:hover{background:#b94f75}.heading{display:flex;justify-content:space-between;align-items:baseline;margin:4px 3px 15px}.heading h2{margin:0;font:500 1.55rem Georgia,serif}.count{color:var(--muted);font-size:.78rem}.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:15px}.card{padding:11px;overflow:hidden}.cover{width:100%;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;border-radius:15px;background:linear-gradient(135deg,#f8dce5,#fceee2);font-size:3rem}.cover img{width:100%;height:100%;object-fit:cover}.info{padding:12px 4px 3px}.title{overflow:hidden;font-weight:800;text-overflow:ellipsis;white-space:nowrap}.artist{margin-top:3px;color:var(--muted);font-size:.84rem}.actions{display:flex;gap:7px;margin-top:12px}.play,.spotify{flex:1;display:flex;min-height:36px;justify-content:center;align-items:center;padding:8px;font-size:.74rem;text-decoration:none;text-align:center}.spotify{border:1px solid var(--line);border-radius:999px;color:var(--pink);font-weight:750;background:#fff8fa}.spotify:hover{background:#fff1f4}.player{margin-top:10px;overflow:hidden;border-radius:12px}.player iframe{display:block;width:100%;height:152px;border:0}.remove{display:block;margin:9px auto 0;border:0;background:none;color:#ad8d9b;cursor:pointer;font:inherit;font-size:.72rem}.remove:hover{color:var(--pink)}.empty{grid-column:1/-1;padding:45px 20px;border:1px dashed #eacbd6;border-radius:22px;color:var(--muted);text-align:center}.empty b{display:block;margin-bottom:8px;font-size:2rem}footer{margin-top:28px;color:#a58d98;font-size:.75rem;text-align:center}
		.petals{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}.petal{position:absolute;top:-25px;width:19px;height:26px;border-radius:90% 10% 80% 20%;background:#f3a9bf;opacity:.9;animation:fall 20s linear infinite}.petal:nth-child(1){left:5%;animation-delay:-2s}.petal:nth-child(2){left:16%;animation-delay:-8s}.petal:nth-child(3){left:27%;animation-delay:-14s}.petal:nth-child(4){left:38%;animation-delay:-5s}.petal:nth-child(5){left:49%;animation-delay:-11s}.petal:nth-child(6){left:60%;animation-delay:-17s}.petal:nth-child(7){left:71%;animation-delay:-3s}.petal:nth-child(8){left:82%;animation-delay:-12s}.petal:nth-child(9){left:93%;animation-delay:-7s}.petal:nth-child(10){left:33%;animation-delay:-19s}.petal:nth-child(11){left:66%;animation-delay:-9s}.petal:nth-child(12){left:9%;animation-delay:-15s}@keyframes fall{to{transform:translate(65px,110vh) rotate(430deg)}}
		.bottom-button{display:inline-block;margin-top:14px;padding:12px 22px;border:1px solid #e9bdcb;border-radius:999px;background:#fff8fa;color:var(--pink);font-family:Georgia,serif;font-size:.96rem;font-weight:700;letter-spacing:.02em;text-decoration:none;transition:background .2s ease}.bottom-button:hover{background:#fff1f4}
		.add,.play,.slot-button,.bottom-button{font-family:"Trebuchet MS",system-ui,sans-serif;letter-spacing:.01em}
		.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:start}.slot{padding:11px;animation:gentle-float 5s ease-in-out infinite;transition:scale .2s ease}.slot:hover{scale:1.04}.slot:nth-child(2){animation-delay:-1.2s}.slot:nth-child(3){animation-delay:-2.4s}.slot:nth-child(4){grid-column:2;animation-delay:-3.6s}@keyframes gentle-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.slot .cover{position:relative;min-height:170px;cursor:pointer}.slot .cover:focus-visible{outline:3px solid #e98eaa;outline-offset:3px}.slot .cover img{position:absolute;inset:0}.slot input[type=file]{display:none}.slot-controls{display:grid;gap:8px;margin-top:11px}.slot-button{display:flex;min-height:54px;align-items:center;justify-content:center;padding:14px 18px;border:1px solid var(--line);border-radius:999px;background:#fff8fa;color:var(--pink);font:inherit;font-size:.96rem;font-weight:900;letter-spacing:.02em;text-align:center;cursor:pointer;width:100%}.slot-button:hover{background:#fff1f4}.slot-button.spotify-added{background:var(--pink);color:white;border-color:var(--pink)}
		@media(max-width:680px){.wrap{width:calc(100% - 24px);padding-top:12px}.layout{grid-template-columns:1fr}.panel{position:static}.songs{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:11px}.gallery{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.slot{padding:7px}.slot:nth-child(4){grid-column:2}.slot .cover{min-height:105px}}
	</style>
</head>
<body>
	<div class="petals" aria-hidden="true"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i></div>
	<main class="wrap">
		<header><div class="eyebrow">A little corner for our songs</div><h1>Our <span>Playlist</span> 🌸</h1></header>
		<section aria-label="Your picture and music spots"><div class="heading"><span class="count"></span></div><div class="gallery">
			<article class="card slot"><div class="cover" role="button" tabindex="0" aria-label="Choose a picture">🌷</div><input type="file" accept="image/*"><div class="slot-controls"><button class="slot-button spotify-button" type="button">♫ Give It A Listen</button></div></article>
			<article class="card slot"><div class="cover" role="button" tabindex="0" aria-label="Choose a picture">🌷</div><input type="file" accept="image/*"><div class="slot-controls"><button class="slot-button spotify-button" type="button">♫ Give It A Listen</button></div></article>
			<article class="card slot"><div class="cover" role="button" tabindex="0" aria-label="Choose a picture">🌸</div><input type="file" accept="image/*"><div class="slot-controls"><button class="slot-button spotify-button" type="button">♫ Give It A Listen</button></div></article>
			<article class="card slot"><div class="cover" role="button" tabindex="0" aria-label="Choose a picture">🌼</div><input type="file" accept="image/*"><div class="slot-controls"><button class="slot-button spotify-button" type="button">♫ Give It A Listen</button></div></article>
		</div></section>
		<footer><a class="bottom-button" href="Untitled-6.html">Continue to the next page</a></footer>
	</main>
	<script>
		const SPOTIFY_LINKS=['https://open.spotify.com/track/6LAitVJIwyCy4bJGN9TIhn?si=f4641259e3354c04','https://open.spotify.com/track/40riOy7x9W7GXjyGp4pjAv?si=a8140c4e1bff4fc4','https://open.spotify.com/track/4PyN1rUjh0xRWqVZ1mwn7l?si=c2bddc0631b7472d','https://open.spotify.com/track/6IPwKM3fUUzlElbvKw2sKl?si=71080201775c405f'];
		document.querySelectorAll('.slot').forEach((slot,index)=>{
			const cover=slot.querySelector('.cover'),picker=slot.querySelector('input[type="file"]'),spotifyButton=slot.querySelector('.spotify-button'),storageKey=`petal-image-${index}`;
			const showImage=src=>{const image=document.createElement('img');image.src=src;image.alt='Your picture';cover.replaceChildren(image)};
			try{const savedImage=localStorage.getItem(storageKey);if(savedImage)showImage(savedImage)}catch{}
			cover.addEventListener('click',()=>picker.click());
			cover.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();picker.click()}});
			picker.addEventListener('change',()=>{const file=picker.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{localStorage.setItem(storageKey,reader.result);showImage(reader.result)}catch{alert('This image could not be saved. Try a smaller image.')}};reader.readAsDataURL(file)});
			spotifyButton.addEventListener('click',()=>{const value=SPOTIFY_LINKS[index]?.trim();if(!value){alert('Add this slot’s Spotify URL in the SPOTIFY_LINKS array in the page code.');return}try{const url=new URL(value);if(url.protocol!=='https:'||(url.hostname!=='open.spotify.com'&&url.hostname!=='www.open.spotify.com'))throw new Error();window.open(url.href,'_blank','noopener,noreferrer')}catch{alert('Please add a valid https://open.spotify.com link to SPOTIFY_LINKS.')}});
		});
	</script>
</body>
</html>
